# =============================================================================
# PR: feat/strip-superset-prefix
# Reverse proxy that removes the /superset/ prefix from all public URLs.
# -----------------------------------------------------------------------------
#   domain/superset/dashboard/1  ->  domain/dashboard/1
#   domain/superset/welcome      ->  domain/welcome
#
# How it works:
#   * The Superset backend still serves its routes under /superset/* (that
#     namespace is baked into the Flask-AppBuilder views). We do NOT change the
#     backend; nginx translates between clean public URLs and that namespace.
#   * Any address-bar hit on /superset/<x> is 301'd to the clean /<x>.
#   * Clean app routes (/dashboard, /welcome, ...) are rewritten back to
#     /superset/<x> when proxied upstream, so the backend still matches them.
#   * `proxy_redirect` (server-level) strips /superset/ out of every Location
#     header, so backend redirects (login, the start-dashboard redirect, etc.)
#     also land on clean URLs -- no broken 302.
#
# A pure source-level alternative (changing the Superset view `route_base` to
# "/") is described in PR_PLAN.md; the proxy approach is preferred for
# production because it needs no fork of the routing layer.
# =============================================================================

upstream superset_app {
    server superset:8088;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100m;

    # Strip /superset/ out of any redirect (Location header) coming back from
    # the app, so logins and the start-dashboard 302 resolve to clean URLs.
    proxy_redirect ~^(?:https?://[^/]+)?/superset/(.*)$ /$1;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # 1) Clean the address bar: any explicit /superset/* -> 301 to /*
    location ~ ^/superset/(?<rest>.*)$ {
        return 301 /$rest$is_args$args;
    }

    # 2) Clean app routes -> rewrite back into the backend's /superset/* namespace
    location ~ ^/(welcome|dashboard|chart|explore|sqllab|tablemodelview|savedqueryview|profile|dashboardasync|sliceaddview)(/.*)?$ {
        rewrite ^/(.*)$ /superset/$1 break;
        proxy_pass http://superset_app;
    }

    # 3) Everything else passes straight through:
    #    /, /api/*, /static/*, /login/*, /logout/, /health, /users/* ...
    location / {
        proxy_pass http://superset_app;
    }
}
